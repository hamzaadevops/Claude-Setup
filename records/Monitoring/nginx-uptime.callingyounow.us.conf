# Uptime Kuma - origin config (team-vpn-box)
# Fronted by Cloudflare. Origin TLS is currently a self-signed cert, so the
# Cloudflare SSL mode must remain "Full" until an Origin Certificate replaces it.
#
#   /status/health + its API/assets -> PUBLIC, open to everyone
#   /api/push/                      -> only the DealerPulse droplet may push
#   everything else                 -> only allow-listed IPs (the dashboard)
#   anything else, or by-IP scans   -> connection dropped
#
# Modified 2026-09-22: carved the "health" status page out of the IP allowlist.
# Rationale: a status page exists to be shared, and the allowlist was returning
# 403 to everyone outside a handful of IPs - including real viewers of
# /status/health (see kuma-push.error.log). The dashboard remains restricted.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    listen [::]:80;
    server_name uptime.callingyounow.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name uptime.callingyounow.us;

    ssl_certificate     /etc/ssl/cloudflare/uptime.callingyounow.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/uptime.callingyounow.us.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/kuma-push.access.log;
    error_log  /var/log/nginx/kuma-push.error.log;

    # ── PUBLIC: the "health" status page ────────────────────────────────────
    # Scoped to this one slug. A status page needs four things, and serving
    # only /status/health gives a blank page:
    #   1. the page itself
    #   2. /api/status-page/health          - its config (+ /manifest.json under it)
    #   3. /api/status-page/heartbeat/health - the live heartbeat data
    #   4. /assets/*                         - the compiled JS/CSS bundle
    # `=` is an exact match and `^~` a prefix match; both outrank the generic
    # `location /` below, so these bypass the allowlist while nothing else does.
    # To publish another status page, add its slug here - do NOT widen `location /`.

    location = /status/health {
        include snippets/kuma-proxy-public.conf;
    }

    # Covers /api/status-page/health and /api/status-page/health/manifest.json.
    # Prefix match, so a future slug beginning "health" would also be exposed.
    location ^~ /api/status-page/health {
        include snippets/kuma-proxy-public.conf;
    }

    location = /api/status-page/heartbeat/health {
        include snippets/kuma-proxy-public.conf;
    }

    # Compiled frontend bundle. No secrets - the same JS/CSS every visitor gets.
    location ^~ /assets/ {
        include snippets/kuma-proxy-public.conf;
    }

    location = /icon.svg      { include snippets/kuma-proxy-public.conf; }
    location = /favicon.ico   { include snippets/kuma-proxy-public.conf; }
    location = /manifest.json { include snippets/kuma-proxy-public.conf; }
    location = /serviceWorker.js { include snippets/kuma-proxy-public.conf; }

    # ── RESTRICTED: push endpoint, only the DealerPulse droplet ─────────────
    location /api/push/ {
        allow 146.190.132.236;
        deny  all;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }

    # ── RESTRICTED: the dashboard and everything else ───────────────────────
    # Note this allowlist is IPv4+IPv6 literal and the team's addresses are
    # dynamic, so it needs re-editing whenever someone's ISP reassigns them.
    # Cloudflare Access would remove that treadmill entirely.
    location / {
        allow 154.192.226.49;
        allow 72.255.40.188;
        allow 2400:adc5:16c:8200::/64;
        allow 2407:d000:904:37b::/64;
        deny  all;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # Kuma's UI is Socket.io, so the upgrade must be proxied or the
        # dashboard loads but never receives live data.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    ssl_certificate     /etc/ssl/cloudflare/uptime.callingyounow.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/uptime.callingyounow.us.key;
    return 444;
}
