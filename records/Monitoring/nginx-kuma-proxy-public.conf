# Shared proxy settings for the PUBLIC status-page locations.
# No allow/deny here on purpose — inclusion in a location makes it public.
# Deliberately omits the Socket.io Upgrade headers: the status page polls over
# plain HTTP (autoRefreshInterval), only the dashboard needs the websocket.
proxy_pass http://127.0.0.1:3001;
proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 10s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;
