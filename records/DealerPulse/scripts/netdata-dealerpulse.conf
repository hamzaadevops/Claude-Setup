# DealerPulse — backend thread exhaustion
#
# Why this exists: on 2026-09-16 the backend stopped answering for three hours
# while CPU sat at 8% and load average at 0.2. Every capacity metric looked
# healthy. The only signal that moved was this one — the container's thread
# count climbing 12 -> 142 as requests blocked on database connections and
# never returned. Nothing was watching it, and the outage was found two days
# later by accident.
#
# Thresholds are measured, not guessed. Daily peak over 2026-09-12..18 was
# 9, 11, 12 and 14 threads. The incident peaked at 142.
#   warn 30 — roughly 2x the highest normal peak. On the incident timeline
#             (20:20 = 26 threads, 20:45 = 51) this fires around 20:25, about
#             25 minutes after onset.
#   crit 60 — sustained exhaustion; reached around 21:00 that night.

    alarm: dealerpulse_backend_threads_blue
       on: cgroup_dealerpulse_backend-web_blue-1.pids_current
    class: Errors
     type: Cgroups
component: Backend
     calc: $pids
    units: threads
    every: 30s
     warn: $this > 30
     crit: $this > 60
    delay: up 1m down 10m multiplier 1.5 max 1h
  summary: DealerPulse backend (blue) thread count
     info: Threads held by the blue backend container. Normal is 9-14. Sustained growth means requests are blocking and never returning, which is the signature of the 2026-09-16 outage. Check database connectivity before assuming load.
       to: sysadmin

    alarm: dealerpulse_backend_threads_green
       on: cgroup_dealerpulse_backend-web_green-1.pids_current
    class: Errors
     type: Cgroups
component: Backend
     calc: $pids
    units: threads
    every: 30s
     warn: $this > 30
     crit: $this > 60
    delay: up 1m down 10m multiplier 1.5 max 1h
  summary: DealerPulse backend (green) thread count
     info: Threads held by the green backend container. Normal is 9-14. Sustained growth means requests are blocking and never returning, which is the signature of the 2026-09-16 outage. Check database connectivity before assuming load.
       to: sysadmin
